<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: http:; font-src 'self' data: https:; frame-src 'self' about:; connect-src 'none'">
  <title>OpenMail</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../../assets/logo-full.png" alt="OpenMail"></div>
    <input id="search" class="search" type="search" placeholder="Search current folder">
    <label class="switch" id="backup-switch" title="Copy the mailbox to your backup folder when OpenMail closes. Always starts off.">
      <input type="checkbox" id="backup-toggle">
      <span class="slider" aria-hidden="true"></span>
      <span class="switch-label">☁ Back up on exit</span>
    </label>
    <div class="account" id="account"></div>
  </header>

  <nav class="ribbon">
    <button id="btn-new" class="primary" title="New email (Ctrl+N)">✉ New Email</button>
    <span class="sep"></span>
    <button id="btn-reply" data-needs-one title="Reply (Ctrl+R)">↩ Reply</button>
    <button id="btn-replyall" data-needs-one title="Reply all (Ctrl+Shift+R)">↩↩ Reply All</button>
    <button id="btn-forward" data-needs-one title="Forward (Ctrl+F)">↪ Forward</button>
    <span class="sep"></span>
    <button id="btn-delete" data-needs-item title="Delete selected (Del)">🗑 Delete</button>
    <button id="btn-move" data-needs-item title="Move selected to a folder (Ctrl+Shift+V)">📁 Move</button>
    <button id="btn-unread" data-needs-item title="Mark read / unread (Ctrl+Q / Ctrl+U)">● Read/Unread</button>
    <button id="btn-flag" data-needs-item title="Flag for follow-up">⚑ Flag</button>
    <span class="sep"></span>
    <button id="btn-sync" title="Sync with Gmail now (F9)">⟳ Sync Now</button>
    <button id="btn-rules">⚙ Rules</button>
    <button id="btn-import" title="Import messages from another PST file">📥 Import PST</button>
    <button id="btn-settings">☰ Settings</button>
    <button id="btn-log">📝 Activity</button>
  </nav>

  <div id="banner" class="banner" hidden></div>

  <main class="panes">
    <aside class="folders">
      <div class="pane-head">
        <span id="store-name">Folders</span>
        <button id="btn-newfolder" class="icon" title="New folder">＋</button>
      </div>
      <ul id="folder-tree" class="tree"></ul>
    </aside>

    <section class="list">
      <div class="pane-head">
        <span><span id="folder-title">Inbox</span> <span id="list-count" class="hint"></span></span>
        <label class="filter"><input type="checkbox" id="unread-only"> Unread only</label>
      </div>
      <div id="list-columns" class="list-columns"></div>
      <ul id="message-list" class="messages" tabindex="0"></ul>
      <button id="load-more" class="load-more" hidden>Load more</button>
    </section>

    <section class="reader" id="reader">
      <div class="empty">Select a message to read it</div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status-text">Ready</span>
    <progress id="status-progress" hidden></progress>
    <button id="btn-stop" class="link" hidden>Pause</button>
    <span class="spacer"></span>
    <span id="totals"></span>
  </footer>

  <div id="modal-root"></div>
  <div id="backup-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2>Backing up your mailbox</h2>
      <p id="backup-text">Finishing up…</p>
      <progress id="backup-progress"></progress>
      <p class="hint" id="backup-dest"></p>
      <button id="backup-skip">Skip backup and close</button>
    </div>
  </div>
  <template id="tpl-setup">
    <div class="setup">
      <img class="setup-logo" src="../../assets/logo-full.png" alt="OpenMail">
      <h2>Welcome to OpenMail</h2>
      <p>OpenMail downloads your Gmail into a PST mailbox, files it into folders, and keeps it organised with rules.</p>
      <ol>
        <li><strong>Gmail account</strong>: add your Google OAuth client ID in Settings (see README), then sign in.</li>
        <li><strong>Mailbox</strong>: your mail is stored in a standard Outlook PST file that OpenMail reads and writes itself (Outlook is not needed). You can import old PST files too.</li>
        <li><strong>Sync</strong>: run the initial sync. Nothing is removed from Gmail until you turn on trashing in Settings.</li>
      </ol>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
